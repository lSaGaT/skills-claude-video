<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>iPhone 18 Pro Max Burgundy — geometria real do GLB (skill cel_iphone_html)</title>
<style>
  html, body { margin: 0; height: 100%; background: radial-gradient(1200px 800px at 50% 30%, #1b1b21 0%, #0b0b0f 60%, #050508 100%); overflow: hidden; }
  canvas { display: block; }
  #ui { position: fixed; top: 16px; left: 16px; color: #d8d4d6; font: 13px/1.5 system-ui, sans-serif; user-select: none; }
  #ui h1 { font-size: 15px; font-weight: 600; margin: 0 0 2px; color: #efe7ea; letter-spacing: .2px; }
  #ui .sub { opacity: .55; margin-bottom: 10px; }
  #ui button {
    background: rgba(255,255,255,.08); color: #d8d4d6; border: 1px solid rgba(255,255,255,.14);
    border-radius: 8px; padding: 6px 12px; font: 12px system-ui, sans-serif; cursor: pointer; margin-right: 6px;
  }
  #ui button:hover { background: rgba(255,255,255,.16); }
  #ui button.on { background: rgba(215,130,160,.25); border-color: rgba(215,130,160,.5); color: #ffd9e4; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="ui">
  <h1>Apple iPhone 18 Pro Max — Burgundy</h1>
  <div class="sub">geometria REAL extraída do GLB (43 malhas · 51.836 vértices) · materiais e texturas originais</div>
  <button id="btnFlash">Flash: desligado</button>
  <button id="btnSpin" class="on">Girar: ligado</button>
</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ============================================================
   RENDERER DATA-DRIVEN: a geometria é a extraída do GLB
   (iphone18-geometria.json — coordenadas de mundo em metros,
   Y-up, exatamente como no modelo original).
   Nada de geometria procedural: carregar → aplicar materiais
   exatos do teardown → desenhar.
   ============================================================ */

// ---------- renderer / scene / camera ----------
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.45;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(32, innerWidth / innerHeight, 10, 5000);
camera.position.set(190, 200, 290);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 80, 0);
controls.enableDamping = true;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.9;
controls.minDistance = 140;
controls.maxDistance = 900;

// ---------- iluminação: IBL + key/rim/fill ----------
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const key = new THREE.DirectionalLight(0xffffff, 3.2);
key.position.set(180, 260, 240);
scene.add(key);
const rim = new THREE.DirectionalLight(0xffe3ea, 0.9);
rim.position.set(-200, 140, -220);
scene.add(rim);
const fill = new THREE.DirectionalLight(0xcfd8ff, 0.6);
fill.position.set(-120, 60, 180);
scene.add(fill);

// ---------- texturas ----------
const texLoader = new THREE.TextureLoader();
function tex(path, { srgb = false } = {}) {
  const t = texLoader.load(path);
  if (srgb) t.colorSpace = THREE.SRGBColorSpace;
  t.wrapS = t.wrapT = THREE.RepeatWrapping;   // UVs do GLB já vêm com o tiling baked
  return t;
}
const TEX = {
  screen: tex('textures/screen-burgundy.jpg', { srgb: true }),
  lensFront: tex('textures/lens-front.jpg', { srgb: true }),
  lens01: tex('textures/lens-01.jpg', { srgb: true }),
  lens02: tex('textures/lens-02.jpg', { srgb: true }),
  lens03: tex('textures/lens-03.jpg', { srgb: true }),
  frameNoise: tex('textures/frame-noise-normal.png'),
  sparkle: tex('textures/sparkle-normal.png'),
  speakerN: tex('textures/speaker-normal.png'),
  speakerAO: tex('textures/speaker-ao.png'),
  flashGrad: tex('textures/flash-gradient.png', { srgb: true })
};

/* ============================================================
   MATERIAIS — fatores LINEARES exatos do teardown do GLB
   (ver references/materiais.md). alpha = BLEND do glTF;
   RENDER_ORDER = ordem de composição dos transparentes.
   ============================================================ */
function lensIrid(m) { m.iridescence = 0.2; m.iridescenceIOR = 1.3; m.iridescenceThicknessRange = [100, 400]; return m; }
const NS = (s) => new THREE.Vector2(s, s);

const MATS = {
  // ---- lentes (iridescência = coating antirreflexo) ----
  BASE_Cam_Lens_Front: lensIrid(new THREE.MeshPhysicalMaterial({ color: new THREE.Color().setRGB(0.8434, 0.8434, 0.8434), metalness: 0, roughness: 0.15, map: TEX.lensFront })),
  BASE_Cam_Lens01:     lensIrid(new THREE.MeshPhysicalMaterial({ color: new THREE.Color().setRGB(0.8434, 0.8434, 0.8434), metalness: 0, roughness: 0.15, map: TEX.lens01 })),
  BASE_Cam_Lens02:     lensIrid(new THREE.MeshPhysicalMaterial({ color: new THREE.Color().setRGB(0.8434, 0.8434, 0.8434), metalness: 0, roughness: 0.15, map: TEX.lens02 })),
  BASE_Cam_Lens03:     lensIrid(new THREE.MeshPhysicalMaterial({ color: new THREE.Color().setRGB(0.8434, 0.8434, 0.8434), metalness: 0, roughness: 0.15, map: TEX.lens03 })),
  BASE_Cam_Lens_Outer: lensIrid(new THREE.MeshPhysicalMaterial({ color: new THREE.Color().setRGB(0.0135, 0.0135, 0.0135), metalness: 0, roughness: 0.15, transparent: true, opacity: 0.45, depthWrite: false })),

  // ---- vidros ----
  // GLB: baseColor 0.051 + alpha 0. Em transmission a cor TINGE o que passa — usar tint neutro.
  BASE_Glass: new THREE.MeshPhysicalMaterial({ color: new THREE.Color().setRGB(0.94, 0.96, 0.98), metalness: 0, roughness: 0.045, ior: 1.6316, transmission: 1, thickness: 0.3, transparent: true, depthWrite: false }),
  BASE_Glass_Black: new THREE.MeshPhysicalMaterial({ color: new THREE.Color().setRGB(0.0033, 0.0033, 0.0033), metalness: 0, roughness: 1.0, clearcoat: 0.25, clearcoatRoughness: 0 }),
  BASE_Sensor: new THREE.MeshPhysicalMaterial({ color: new THREE.Color().setRGB(0.0033, 0.0033, 0.0033), metalness: 0, roughness: 0.98, clearcoat: 0.25, clearcoatRoughness: 0 }),
  BASE_Black: new THREE.MeshPhysicalMaterial({ color: new THREE.Color().setRGB(0.0161, 0.0161, 0.0161), metalness: 0, roughness: 1.0, ior: 1.0 }),

  // ---- cavas internas ----
  BASE_Grey: new THREE.MeshPhysicalMaterial({ color: new THREE.Color().setRGB(0.0050, 0.0050, 0.0084), metalness: 0, roughness: 0.82, ior: 1.381, normalMap: TEX.sparkle, normalScale: NS(0.15) }),
  BASE_Grey_02: new THREE.MeshPhysicalMaterial({ color: new THREE.Color().setRGB(0.0135, 0.0135, 0.0152), metalness: 0, roughness: 0.8, ior: 1.381, normalMap: TEX.sparkle, normalScale: NS(0.15) }),

  // ---- metais ----
  BASE_Chrome_Dark: new THREE.MeshPhysicalMaterial({ color: new THREE.Color().setRGB(0.0781, 0.0781, 0.0781), metalness: 1, roughness: 0.2209 }),
  BASE_Copper: new THREE.MeshPhysicalMaterial({ color: new THREE.Color().setRGB(0.4820, 0.4045, 0.2888), metalness: 1, roughness: 0.045 }),

  // ---- speakers (grade de furos = textura) ----
  BASE_Speakers: new THREE.MeshPhysicalMaterial({ color: new THREE.Color().setRGB(0.1801, 0.1768, 0.1768), metalness: 1, roughness: 0.4, normalMap: TEX.speakerN, normalScale: NS(1), aoMap: TEX.speakerAO }),
  BASE_Speakers_Front: new THREE.MeshPhysicalMaterial({ color: new THREE.Color().setRGB(0.0111, 0.0111, 0.0111), metalness: 1, roughness: 0.4, normalMap: TEX.speakerN, normalScale: NS(1), aoMap: TEX.speakerAO }),

  // ---- flash ----
  BASE_Flash_Base: new THREE.MeshPhysicalMaterial({ color: new THREE.Color().setRGB(0.6055, 0.6055, 0.5924), metalness: 1, roughness: 0.25 }),
  BASE_Flash_Light: new THREE.MeshPhysicalMaterial({ color: new THREE.Color().setRGB(0.6320, 0.4313, 0.1304), metalness: 0, roughness: 0.045, emissive: new THREE.Color().setRGB(0.1362, 0.1242, 0.0940), emissiveIntensity: 0 }),
  BASE_Flash_Ref: new THREE.MeshPhysicalMaterial({ color: new THREE.Color().setRGB(0.5860, 0.5860, 0.5174), metalness: 0, roughness: 0.8, transparent: true, opacity: 0.72, depthWrite: false }),
  'BASE_Flash_Glass duplicate': new THREE.MeshPhysicalMaterial({ color: new THREE.Color().setRGB(0.6388, 0.6456, 0.6592), metalness: 0, roughness: 0.27, transparent: true, opacity: 0.89, depthWrite: false }),
  BASE_Flash_Glass: new THREE.MeshPhysicalMaterial({ color: new THREE.Color().setRGB(0.2977, 0.3066, 0.3204), metalness: 0, roughness: 0.05, transparent: true, opacity: 0.27, depthWrite: false }),
  BASE_Flash_Ref_Gradient: new THREE.MeshPhysicalMaterial({ color: new THREE.Color().setRGB(0.7083, 0.5480, 0.2158), metalness: 0, roughness: 0.5, map: TEX.flashGrad, transparent: true, opacity: 0.45, depthWrite: false }),
  BASE_Cam_Edge_Black: new THREE.MeshPhysicalMaterial({ color: new THREE.Color().setRGB(0.0055, 0.0055, 0.0055), metalness: 0, roughness: 0.1 }),

  // ---- família Cherry (variant Burgundy) ----
  COLOUR_Cherry_Backpanel: new THREE.MeshPhysicalMaterial({ color: new THREE.Color().setRGB(0.0582, 0.0104, 0.0161), metalness: 0, roughness: 0.3, ior: 1.439, transparent: true, opacity: 0.825, depthWrite: false }),
  COLOUR_Cherry_Side_Panel: new THREE.MeshPhysicalMaterial({ color: new THREE.Color().setRGB(0.1220, 0.0582, 0.0677), metalness: 1, roughness: 0.27, normalMap: TEX.frameNoise, normalScale: NS(0.1) }),
  COLOUR_Cherry_Side_Panel_Gloss: new THREE.MeshPhysicalMaterial({ color: new THREE.Color().setRGB(0.1332, 0.0528, 0.0677), metalness: 1, roughness: 0.2 }),
  COLOUR_Cherry_Aniso: new THREE.MeshPhysicalMaterial({ color: new THREE.Color().setRGB(0.0738, 0.0356, 0.0461), metalness: 1, roughness: 0.3, anisotropy: 0.77 }),
  COLOUR_Cherry_Screws: new THREE.MeshPhysicalMaterial({ color: new THREE.Color().setRGB(0.0738, 0.0356, 0.0461), metalness: 1, roughness: 0.2209 }),
  COLOUR_Cherry_Antenna: new THREE.MeshPhysicalMaterial({ color: new THREE.Color().setRGB(0.0738, 0.0199, 0.0242), metalness: 0, roughness: 0.6 }),
  COLOUR_Cherry_Plastic: new THREE.MeshPhysicalMaterial({ color: new THREE.Color().setRGB(0.1036, 0.0161, 0.0303), metalness: 0, roughness: 0.35 }),
  COLOUR_Cherry_Apple: new THREE.MeshPhysicalMaterial({ color: new THREE.Color().setRGB(0.0987, 0.0329, 0.0415), metalness: 0, roughness: 0.045 }),
  COLOUR_Cherry_Screen: new THREE.MeshPhysicalMaterial({
    color: new THREE.Color().setRGB(0.0316, 0.0316, 0.0316), metalness: 0, roughness: 1.0,
    clearcoat: 0.25, clearcoatRoughness: 0,
    emissive: new THREE.Color().setRGB(0.9995, 0.9995, 0.9995),
    emissiveMap: TEX.screen, emissiveIntensity: 3.0
  }),
  COLOUR_Cherry_Side_Button_Detail: new THREE.MeshPhysicalMaterial({ color: new THREE.Color().setRGB(0.0846, 0.0161, 0.0278), metalness: 0, roughness: 0.1 }),
  COLOUR_Cherry_Button_Detail_Border: new THREE.MeshPhysicalMaterial({ color: new THREE.Color().setRGB(0.0385, 0.0127, 0.0170), metalness: 1, roughness: 0.045 })
};

// ordem de composição dos transparentes (de trás para frente)
const RENDER_ORDER = {
  COLOUR_Cherry_Backpanel: 1,
  BASE_Glass: 2,
  BASE_Cam_Lens_Outer: 3,
  BASE_Flash_Ref: 4,
  'BASE_Flash_Glass duplicate': 5,
  BASE_Flash_Glass: 6,
  BASE_Flash_Ref_Gradient: 7
};

/* ============================================================
   CONSTRUÇÃO: carrega a geometria real e instancia as 43 malhas
   ============================================================ */
const phone = new THREE.Group();
scene.add(phone);
const SCALE = 1000; // metros → mm

const data = await fetch('iphone18-geometria.json').then(r => r.json());

function buildMaterial(name, hasVertexColor) {
  const base = MATS[name] || new THREE.MeshPhysicalMaterial({ color: 0xff00ff }); // falta = alerta magenta
  if (!hasVertexColor) return base;
  const key = name + '#vc';
  buildMaterial._cache = buildMaterial._cache || {};
  if (buildMaterial._cache[key]) return buildMaterial._cache[key];
  const clone = base.clone();
  clone.vertexColors = true;                       // COLOR_0 do GLB = AO baked
  buildMaterial._cache[key] = clone;
  return clone;
}

let loaded = 0;
for (const name of data.order) {
  const m = data.meshes[name];
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(m.position).map(v => v * SCALE), 3));
  if (m.uv) g.setAttribute('uv', new THREE.BufferAttribute(new Float32Array(m.uv), 2));
  g.setIndex(m.index);
  if (m.normal) g.setAttribute('normal', new THREE.BufferAttribute(new Float32Array(m.normal), 3));
  else g.computeVertexNormals();
  if (m.color) g.setAttribute('color', new THREE.BufferAttribute(new Float32Array(m.color), 3));

  const mesh = new THREE.Mesh(g, buildMaterial(m.material, !!m.color));
  mesh.name = name;
  if (RENDER_ORDER[m.material] !== undefined) mesh.renderOrder = RENDER_ORDER[m.material];
  phone.add(mesh);
  loaded++;
}

console.log(`carregadas ${loaded}/${data.order.length} malhas da geometria real`);

// ---------- UI ----------
const btnFlash = document.getElementById('btnFlash');
let flashOn = false;
btnFlash.addEventListener('click', () => {
  flashOn = !flashOn;
  MATS.BASE_Flash_Light.emissiveIntensity = flashOn ? 2.5 : 0;
  btnFlash.textContent = flashOn ? 'Flash: aceso' : 'Flash: desligado';
  btnFlash.classList.toggle('on', flashOn);
});
const btnSpin = document.getElementById('btnSpin');
btnSpin.addEventListener('click', () => {
  controls.autoRotate = !controls.autoRotate;
  btnSpin.textContent = controls.autoRotate ? 'Girar: ligado' : 'Girar: desligado';
  btnSpin.classList.toggle('on', controls.autoRotate);
});

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// handles de depuração
window.__debug = { scene, camera, renderer, controls, phone, MATS, data };

renderer.setAnimationLoop(() => {
  controls.update();
  renderer.render(scene, camera);
});
</script>
</body>
</html>
